# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=26.1.2
# 26.x uses official Mojang mappings (see build.gradle)
#yarn_mappings=
loader_version=0.19.3
# Mod Properties
mod_version=0.1.1-26.1.2
maven_group=cn.kaoyu666
archives_base_name=aibuilder
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.155.2+26.1.2
modmenu_version=18.0.0

# Mirrors (China): BMCLAPI for Minecraft downloads, Aliyun for Maven Central / Gradle Plugin Portal
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
loom_resources_base=https://bmclapi2.bangbang93.com/assets/



# Minecraft 26.x+ ships with official (unobfuscated) names: no mappings needed
fabric.loom.disableObfuscation=true
